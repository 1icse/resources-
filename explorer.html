<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Resources | ICSE Resources</title>

    <link rel="stylesheet" href="/resources-/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <div class="background-glow"></div>


    <!-- Top Navigation -->

    <header class="topbar explorer-topbar">

        <div class="explorer-title-area">

            <button class="back-button" id="backButton">

                <i class="fa-solid fa-arrow-left"></i>

            </button>


            <div>

                <h2 id="pageTitle">
                    Resources
                </h2>

                <div class="breadcrumb" id="breadcrumb"></div>

            </div>

        </div>


        <div class="top-actions">

            <button class="icon-button"
                id="explorerSearchButton">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>


            <button class="icon-button"
                id="themeButton">

                <i class="fa-solid fa-sun"></i>

            </button>

        </div>

    </header>



    <!-- Search -->

    <div class="search-overlay"
        id="searchOverlay">

        <div class="search-box">

            <div class="search-header">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search all PDFs..."
                    autocomplete="off"
                >

                <button id="closeSearch">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <div
                id="searchResults"
                class="search-results">

            </div>

        </div>

    </div>



    <!-- Explorer -->

    <main class="explorer-container">

        <div class="explorer-card">

            <div class="explorer-list"
                id="explorerList">

            </div>

        </div>

    </main>


    <script src="/resources-/resources.js"></script>

    <script src="/resources-/app.js"></script>

    <script src="/resources-/explorer.js"></script>

</body>

</html>
